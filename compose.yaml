name: number-plate-recognition

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: number-plate-recognition:local
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${NPR_PORT:-8501}:8501"
    environment:
      NPR_APP_ROOT: /opt/app
      NPR_IMAGE_DIR: /opt/app/images
      NPR_MODEL_DIR: /opt/app/models
      NPR_MODEL_MANIFEST: /opt/app/models/manifest.json
      STREAMLIT_SERVER_HEADLESS: "true"
      XDG_CACHE_HOME: /tmp/.cache
      YOLO_AUTOINSTALL: "false"
      YOLO_CONFIG_DIR: /tmp/ultralytics
      YOLO_OFFLINE: "true"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2).read()
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
