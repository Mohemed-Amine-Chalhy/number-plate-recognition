name: number-plate-recognition

services:
  control-api:
    build:
      context: .
      dockerfile: Dockerfile.platform
    image: campus-access-platform:local
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${CONTROL_API_PORT:-8000}:8000"
    environment:
      CAMPUS_CONSOLE_DIR: /opt/platform/web/console
      CONTROL_API_CORS_ORIGINS: "${CONTROL_API_CORS_ORIGINS:-}"
      CONTROL_API_DB_PATH: /data/campus-control.sqlite3
      CONTROL_API_HOST: 0.0.0.0
      CONTROL_API_PORT: "8000"
      CONTROL_API_SEED_DEMO: "${CONTROL_API_SEED_DEMO:-true}"
    volumes:
      - platform-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 5

  app:
    profiles: [legacy]
    build:
      context: .
      dockerfile: Dockerfile
    image: number-plate-recognition:local
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${NPR_PORT:-8501}:8501"
    environment:
      NPR_APP_ROOT: /opt/app
      NPR_IMAGE_DIR: /opt/app/images
      NPR_MODEL_DIR: /opt/app/models
      NPR_MODEL_MANIFEST: /opt/app/models/manifest.json
      STREAMLIT_SERVER_HEADLESS: "true"
      XDG_CACHE_HOME: /tmp/.cache
      YOLO_AUTOINSTALL: "false"
      YOLO_CONFIG_DIR: /tmp/ultralytics
      YOLO_OFFLINE: "true"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2).read()
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3

volumes:
  platform-data:
