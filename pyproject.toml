[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "number-plate-recognition"
version = "0.1.0"
description = "A typed, testable pipeline for Moroccan vehicle and license-plate recognition."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Mohamed Amine Chalhy" },
]
keywords = ["computer-vision", "license-plate-recognition", "streamlit", "yolo"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "pillow>=10,<13",
  "streamlit>=1.56,<2",
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
  "ultralytics-opencv-headless>=8.3.173,<9",
]

[project.scripts]
npr-recognize = "number_plate_recognition.cli:main"

[project.urls]
Homepage = "https://github.com/Mohemed-Amine-Chalhy/number-plate-recognition"
Issues = "https://github.com/Mohemed-Amine-Chalhy/number-plate-recognition/issues"
Repository = "https://github.com/Mohemed-Amine-Chalhy/number-plate-recognition.git"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pip-audit>=2.9,<3",
  "pre-commit>=4,<5",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]
notebook = [
  "ipykernel>=6,<8",
  "jupyterlab>=4,<5",
  "kagglehub>=0.3,<1",
  "matplotlib>=3.9,<4",
]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/src",
]

[tool.hatch.build.targets.wheel]
packages = ["src/number_plate_recognition"]

[tool.uv]
default-groups = ["dev"]
required-version = ">=0.8.0"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  "Jupyter_notebooks",
  "models",
  "notebooks",
  "sort",
]

[tool.ruff.lint]
select = [
  "B",
  "C4",
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "PERF",
  "PIE",
  "PT",
  "RUF",
  "S",
  "SIM",
  "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B017", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["number_plate_recognition"]

[tool.mypy]
python_version = "3.12"
files = ["src/number_plate_recognition", "app", "tests"]
strict = true
pretty = true
show_error_codes = true
show_column_numbers = true
warn_unreachable = true
exclude = [
  "Jupyter_notebooks/",
  "sort/",
]

[[tool.mypy.overrides]]
module = [
  "cv2",
  "streamlit",
  "streamlit.*",
  "ultralytics",
  "ultralytics.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
  "--strict-config",
  "--strict-markers",
  "-ra",
  "-m",
  "not model",
  "--cov=number_plate_recognition",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=xml",
  "--cov-fail-under=85",
]
markers = [
  "integration: exercises multiple application components and may load model artifacts",
  "model: loads real model artifacts and can be slow",
  "smoke: verifies that the application starts and handles a representative request",
]

[tool.coverage.run]
branch = true
source = ["number_plate_recognition"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.coverage.xml]
output = "coverage.xml"
