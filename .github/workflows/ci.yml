name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  UV_NO_PROGRESS: "1"
  YOLO_AUTOINSTALL: "false"
  YOLO_OFFLINE: "true"

jobs:
  quality:
    name: Python quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.8.15"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Verify dependency lock
        run: uv lock --check

      - name: Validate shell scripts
        run: bash -n scripts/bootstrap.sh scripts/run_app.sh docker/entrypoint.sh

      - name: Install locked development environment
        run: uv sync --locked --group dev

      - name: Validate model manifest
        run: uv run --frozen python scripts/doctor.py --manifest-only

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Type-check
        run: uv run --frozen mypy

      - name: Test with coverage
        run: >-
          uv run --frozen pytest
          --cov=number_plate_recognition
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=85

      - name: Build distribution packages
        run: uv build

      - name: Run commit-stage hooks
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure

      - name: Upload coverage report
        if: ${{ always() && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  windows-compatibility:
    name: Windows / Python 3.12 compatibility
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.8.15"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Verify dependency lock
        run: uv lock --check

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $allParseErrors = @()
          foreach ($scriptPath in @("scripts/bootstrap.ps1", "scripts/run_app.ps1")) {
            $parseTokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $scriptPath),
              [ref]$parseTokens,
              [ref]$parseErrors
            ) | Out-Null
            $allParseErrors += $parseErrors
          }
          if ($allParseErrors.Count -gt 0) {
            $allParseErrors | Format-List
            exit 1
          }

      - name: Install locked development environment
        run: uv sync --locked --group dev

      - name: Diagnose Windows environment and model artifacts
        run: uv run --frozen python scripts/doctor.py

      - name: Run fast test suite
        run: uv run --frozen pytest -m "not model" --no-cov

  real-model-smoke:
    name: Real-model CPU smoke test
    if: ${{ github.event_name != 'pull_request' }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.8.15"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install locked environment
        run: uv sync --locked --group dev

      - name: Verify model artifacts
        run: uv run --frozen python scripts/doctor.py --models-only

      - name: Load models and run one CPU inference
        env:
          NPR_DEVICE: cpu
        run: uv run --frozen pytest tests/model/test_real_inference.py -m model --no-cov

  container-smoke:
    name: Build and smoke-test container
    if: ${{ github.event_name != 'pull_request' }}
    needs: [quality, real-model-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build container
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: number-plate-recognition:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: >-
          docker run --detach
          --name number-plate-recognition-smoke
          --publish 127.0.0.1:8501:8501
          number-plate-recognition:ci

      - name: Wait for application health
        run: >-
          curl
          --fail
          --retry 30
          --retry-delay 2
          --retry-all-errors
          http://127.0.0.1:8501/_stcore/health

      - name: Show container logs
        if: ${{ always() }}
        shell: bash
        run: |
          if docker inspect number-plate-recognition-smoke >/dev/null 2>&1; then
            docker logs number-plate-recognition-smoke
          fi

      - name: Remove smoke-test container
        if: ${{ always() }}
        shell: bash
        run: |
          if docker inspect number-plate-recognition-smoke >/dev/null 2>&1; then
            docker rm --force number-plate-recognition-smoke
          fi
