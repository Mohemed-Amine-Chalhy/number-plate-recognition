name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  UV_NO_PROGRESS: "1"
  YOLO_AUTOINSTALL: "false"
  YOLO_OFFLINE: "true"

jobs:
  quality:
    name: Platform quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            services/control_api/uv.lock

      - name: Install Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Verify dependency locks
        run: |
          uv lock --check
          uv lock --project services/control_api --check

      - name: Validate shell scripts
        run: >-
          bash -n
          scripts/bootstrap.sh
          scripts/bootstrap_platform.sh
          scripts/run_app.sh
          scripts/run_platform.sh
          docker/entrypoint.sh

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $allParseErrors = @()
          foreach ($scriptPath in @(
            "scripts/bootstrap.ps1",
            "scripts/bootstrap_platform.ps1",
            "scripts/run_app.ps1",
            "scripts/run_platform.ps1"
          )) {
            $parseTokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $scriptPath),
              [ref]$parseTokens,
              [ref]$parseErrors
            ) | Out-Null
            $allParseErrors += $parseErrors
          }
          if ($allParseErrors.Count -gt 0) {
            $allParseErrors | Format-List
            exit 1
          }

      - name: Install locked project environments
        run: |
          uv sync --locked --group dev
          uv sync --project services/control_api --locked --group dev

      - name: Run platform diagnostics
        run: uv run --frozen python scripts/platform_doctor.py

      - name: Check ML app, control API, console, and scripts
        run: >-
          uv run --frozen python scripts/platform_quality.py check
          --keep-going
          --require-script-shells

      - name: Build distribution packages
        run: uv build

      - name: Run commit-stage hooks
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure

      - name: Upload coverage report
        if: ${{ always() && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  windows-compatibility:
    name: Windows / Python 3.12 compatibility
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            services/control_api/uv.lock

      - name: Install Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Verify dependency locks
        run: |
          uv lock --check
          uv lock --project services/control_api --check

      - name: Validate shell scripts
        shell: bash
        run: >-
          bash -n
          scripts/bootstrap.sh
          scripts/bootstrap_platform.sh
          scripts/run_app.sh
          scripts/run_platform.sh
          docker/entrypoint.sh

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $allParseErrors = @()
          foreach ($scriptPath in @(
            "scripts/bootstrap.ps1",
            "scripts/bootstrap_platform.ps1",
            "scripts/run_app.ps1",
            "scripts/run_platform.ps1"
          )) {
            $parseTokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $scriptPath),
              [ref]$parseTokens,
              [ref]$parseErrors
            ) | Out-Null
            $allParseErrors += $parseErrors
          }
          if ($allParseErrors.Count -gt 0) {
            $allParseErrors | Format-List
            exit 1
          }

      - name: Install locked project environments
        run: |
          uv sync --locked --group dev
          uv sync --project services/control_api --locked --group dev

      - name: Diagnose Windows environment and model artifacts
        run: |
          uv run --frozen python scripts/platform_doctor.py
          uv run --frozen python scripts/doctor.py

      - name: Run Windows root tests
        run: >-
          uv run --frozen pytest
          tests/unit
          tests/integration
          tests/smoke
          tests/model
          tests/platform_inference
          -m "not model"
          --no-cov
          --basetemp .runtime/pytest-windows-root

      - name: Run control API gates
        run: uv run --frozen python scripts/platform_quality.py check --scope service

      - name: Run web console checks
        run: uv run --frozen python scripts/platform_quality.py check --scope frontend

  real-model-smoke:
    name: Real-model CPU smoke test
    if: ${{ github.event_name != 'pull_request' }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install locked environment
        run: uv sync --locked --group dev

      - name: Verify model artifacts
        run: uv run --frozen python scripts/doctor.py --models-only

      - name: Load models and run one CPU inference
        env:
          NPR_DEVICE: cpu
        run: uv run --frozen pytest tests/model/test_real_inference.py -m model --no-cov

  container-smoke:
    name: Build and smoke-test platform image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build platform container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.platform
          load: true
          push: false
          tags: campus-access-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start platform container
        run: >-
          docker run --detach
          --name campus-access-platform-smoke
          --read-only
          --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777
          --tmpfs /data:rw,noexec,nosuid,size=64m,mode=1777
          --cap-drop ALL
          --security-opt no-new-privileges
          --publish 127.0.0.1:8000:8000
          campus-access-platform:ci

      - name: Wait for API readiness
        run: >-
          curl
          --fail
          --retry 30
          --retry-delay 1
          --retry-all-errors
          http://127.0.0.1:8000/health/ready

      - name: Smoke-test console and authenticated dashboard
        shell: bash
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/ | grep -q "Campus Access Console"
          curl --fail --silent --show-error --header "Authorization: Bearer demo-viewer" --header "X-Organization-ID: org-atlas" http://127.0.0.1:8000/api/v1/dashboard | python -c 'import json,sys; payload=json.load(sys.stdin); assert len(payload["gates"]) == 6'
          docker exec campus-access-platform-smoke python -c 'import os; assert os.getuid() == 10001'

      - name: Show container logs
        if: ${{ always() }}
        shell: bash
        run: |
          if docker inspect campus-access-platform-smoke >/dev/null 2>&1; then
            docker logs campus-access-platform-smoke
          fi

      - name: Remove smoke-test container
        if: ${{ always() }}
        shell: bash
        run: |
          if docker inspect campus-access-platform-smoke >/dev/null 2>&1; then
            docker rm --force campus-access-platform-smoke
          fi
