[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "campus-control-api"
version = "0.1.0"
description = "Self-contained control-plane API for the campus access platform demo."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2,<3",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2.9,<3",
  "mypy>=1.15,<2",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["control_api"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "C4", "E4", "E7", "E9", "F", "I", "PERF", "PIE", "PT", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"../../tests/platform_backend/**/*.py" = ["S101"]
"tests/platform_backend/**/*.py" = ["S101"]
"**/platform_backend/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
pretty = true
show_error_codes = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["../../tests/platform_backend"]
addopts = ["--strict-config", "-ra"]
